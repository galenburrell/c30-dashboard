name: Update C30 dashboard

# Census publishes C30 on about the first business day of each month at 10:00 ET.
# This checks every weekday shortly after; runs with no new release end without a commit.
on:
  schedule:
    - cron: "30 16 * * 1-5"
  workflow_dispatch: {}
  # Fallback if Census ever blocks automated downloads: upload the workbooks into raw/ on GitHub.
  push:
    paths: ["raw/**"]

permissions:
  contents: write

concurrency:
  group: c30-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl==3.1.5

      - name: Download Census workbooks
        id: fetch
        if: github.event_name != 'push'
        run: python3 fetch.py

      - name: Build data and dashboard
        if: github.event_name == 'push' || steps.fetch.outputs.new_release == 'true'
        run: |
          python3 build.py raw
          python3 render.py
          python3 summary.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit release
        if: github.event_name == 'push' || steps.fetch.outputs.new_release == 'true'
        run: |
          git config user.name "c30-update-bot"
          git config user.email "c30-update-bot@users.noreply.github.com"
          git add -A
          REL=$(python3 -c "import json;print(json.load(open('out/data.json'))['meta']['release'])")
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "C30 release ${REL}"
          git push
